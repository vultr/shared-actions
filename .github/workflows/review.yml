name: AI PR Review
on:
  workflow_call:

# Emergency containment: PR Agent evaluated attacker-controlled review settings
# with credentials in its environment. Keep this reusable workflow as a disabled
# compatibility entry point for callers. Do not restore the agent until the
# template/configuration execution path is fixed and exposed keys are rotated.
permissions: {}

jobs:
  pr_agent_job:
    name: AI review disabled for security remediation
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Review disabled
        run: echo 'AI review is disabled pending security remediation.'
