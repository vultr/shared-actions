name: Secret Scan
on:
  pull_request:
  workflow_call:
    inputs:
      config:
        description: 'Optional path to a Gitleaks configuration file'
        required: false
        type: string
        default: ''
      redact:
        description: 'Redact detected secrets from scan output'
        required: false
        type: boolean
        default: true
    secrets:
      github_token:
        description: 'Optional token for the Gitleaks action'
        required: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for leaked credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.github_token || secrets.GITHUB_TOKEN }}
        with:
          config: ${{ inputs.config }}
          redact: ${{ inputs.redact }}
